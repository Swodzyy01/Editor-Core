<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262e4a"/>
      <stop offset="1" stop-color="#0d1019"/>
    </linearGradient>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df3ff"/>
      <stop offset="1" stop-color="#19b6e8"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8ac0"/>
      <stop offset="1" stop-color="#e93f8e"/>
    </linearGradient>
    <clipPath id="clip"><rect width="256" height="256" rx="52"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- zemin -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- editor izgarasi -->
  <g clip-path="url(#clip)" stroke="#9db0ff" stroke-opacity="0.11" stroke-width="2">
    <path d="M32 0V256M64 0V256M96 0V256M128 0V256M160 0V256M192 0V256M224 0V256"/>
    <path d="M0 32H256M0 64H256M0 96H256M0 128H256M0 160H256M0 192H256M0 224H256"/>
  </g>

  <!-- yerlestirilmis bloklar -->
  <g>
    <rect x="64" y="160" width="32" height="32" rx="5" fill="#2fd6a1"/>
    <rect x="96" y="160" width="32" height="32" rx="5" fill="#2fd6a1"/>
    <rect x="128" y="160" width="32" height="32" rx="5" fill="#2fd6a1"/>
    <rect x="96" y="128" width="32" height="32" rx="5" fill="#f5b83d"/>
    <rect x="64" y="160" width="32" height="32" rx="5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="96" y="160" width="32" height="32" rx="5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="128" y="160" width="32" height="32" rx="5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="96" y="128" width="32" height="32" rx="5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- B'nin henuz yerlestirmedigi hayalet blok -->
  <rect x="160" y="128" width="32" height="32" rx="5" fill="#ff5fa2" fill-opacity="0.16" stroke="#ff7ab5" stroke-width="3" stroke-dasharray="7 6"/>

  <!-- iki imleci baglayan kesikli cizgi -->
  <path d="M88 76 C 120 60, 170 70, 176 118" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 11"/>

  <!-- imlec A (camgobegi) + isim etiketi -->
  <g>
    <g filter="url(#soft)" opacity="0.65" transform="translate(52 40)">
      <path d="M0 0 L0 42 L12 31 L21 51 L29 47 L20 28 L36 28 Z" fill="#19b6e8"/>
    </g>
    <path d="M52 40 L52 82 L64 71 L73 91 L81 87 L72 68 L88 68 Z" fill="url(#gA)" stroke="#06202b" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="76" y="94" width="68" height="26" rx="13" fill="url(#gA)" stroke="#06202b" stroke-width="3"/>
    <circle cx="90" cy="107" r="5" fill="#06202b"/>
    <rect x="100" y="102" width="34" height="10" rx="5" fill="#06202b" fill-opacity="0.85"/>
  </g>

  <!-- imlec B (pembe) + isim etiketi -->
  <g>
    <g filter="url(#soft)" opacity="0.65" transform="translate(160 100)">
      <path d="M0 0 L0 42 L12 31 L21 51 L29 47 L20 28 L36 28 Z" fill="#e93f8e"/>
    </g>
    <path d="M160 100 L160 142 L172 131 L181 151 L189 147 L180 128 L196 128 Z" fill="url(#gB)" stroke="#2c0618" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="178" y="154" width="60" height="26" rx="13" fill="url(#gB)" stroke="#2c0618" stroke-width="3"/>
    <circle cx="192" cy="167" r="5" fill="#2c0618"/>
    <rect x="202" y="162" width="26" height="10" rx="5" fill="#2c0618" fill-opacity="0.85"/>
  </g>

  <!-- cerceve -->
  <rect x="2" y="2" width="252" height="252" rx="50" fill="none" stroke="#46527f" stroke-width="4"/>
</svg>
